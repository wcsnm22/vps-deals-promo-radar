<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 288" width="760" height="288" role="img" aria-label="IONOS: what the monthly fee buys">
<rect width="760" height="288" fill="#0f172a" rx="10"/>
<text x="24" y="42" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="20" font-weight="600">IONOS: what the monthly fee buys</text>
<text x="24" y="64" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="13">Bar length is the published monthly price; the number beside it is the RAM it includes.</text>
<text x="24" y="90" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="13">IONOS VPS XXL+</text>
<rect x="324" y="78" width="292.0" height="18" fill="#38bdf8" rx="3"/>
<text x="624.0" y="91" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="12">20 USD = 24 GB RAM</text>
<text x="24" y="124" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="13">IONOS VPS XL+</text>
<rect x="324" y="112" width="204.4" height="18" fill="#38bdf8" rx="3"/>
<text x="536.4" y="125" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="12">14 USD = 16 GB RAM</text>
<text x="24" y="158" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="13">IONOS VPS S+</text>
<rect x="324" y="146" width="29.2" height="18" fill="#38bdf8" rx="3"/>
<text x="361.2" y="159" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="12">2 USD = 2 GB RAM</text>
<text x="24" y="192" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="13">IONOS VPS L+</text>
<rect x="324" y="180" width="116.8" height="18" fill="#38bdf8" rx="3"/>
<text x="448.8" y="193" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="12">8 USD = 8 GB RAM</text>
<text x="24" y="226" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="13">IONOS VPS M+</text>
<rect x="324" y="214" width="73.0" height="18" fill="#38bdf8" rx="3"/>
<text x="405.0" y="227" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="12">5 USD = 4 GB RAM</text>
</svg>