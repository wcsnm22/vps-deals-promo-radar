name: update

# 每 6 小时抓一次 + 重新生成 + 提交 + 部署到 Cloudflare Pages
# 优惠站卖的是及时度，所以别只跑一次；公开仓库的 Actions 分钟数不限。
on:
# schedule: disabled 2026-11-04 -- VPS systemd timer is the single runner
#   - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape public provider pages
        run: python scraper.py

      # 抓取失败（证书错误、超时、被拒抓）和厂商真的整体下架在数据里长得一样，
      # 但放着不管就会把半边数据集当成今天的事实发上线，还会删掉整批页面。
      # 某家 provider 整批归零就停在这里：不 commit、不 deploy，线上保持上一版。
      # 真确认是厂商下架了，手动重跑时带上 GUARD_FORCE=1 说明原因再放行。
      - name: Refuse to publish a regressed scrape
        run: python guard.py

      - name: Build static site
        run: python build.py

      # 写稿判据自查：第一屏有答案、独家≥30%、无中文残留/视频痕迹。
      # 不合格就别发，线上保持上一版。
      - name: Check the written pages
        run: python content_check.py

      # site/ 是构建产物，已移出版本库：两边各自重建、只提交数据，
      # 这样本机与 Actions 的提交不会在生成的 HTML 上反复冲突。
      - name: Commit refreshed data
        run: |
          git config user.name "vps-deals-radar"
          git config user.email "vps-deals-radar@users.noreply.github.com"
          git add data/offers.json
          if git diff --staged --quiet; then
            echo "no data change this run"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      # 2026-10-20 的事故：这一行以前是 production 部署，每 6 小时用 origin/main 的旧内容
      # 把本机刚发的页面盖回去（线上指南一度只剩 24 篇）。根因是本机 git push 凭据失效，
      # origin 落后了 5 个提交，Actions 却照样发 production。
      # 现在项目里的生产分支是 `production`，只由本机的日更任务发；这里 main 分支的部署
      # 落在预览地址上，留作"这套内容在干净环境里也能构建出来"的冒烟测试。
      # 另外必须带 success()：以前只有 token 判断，前面的 push 失败也会照发，等于发布一份
      # 没进仓库的构建。
      - name: Deploy to Cloudflare Pages (preview)
        if: ${{ success() && env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx --yes wrangler@4 pages deploy site --project-name=vps-deals-promo-radar --branch=main --commit-dirty=true
