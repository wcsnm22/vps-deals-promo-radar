name: update

# 每 6 小时抓一次 + 重新生成 + 提交 + 部署到 Cloudflare Pages
# 优惠站卖的是及时度，所以别只跑一次；公开仓库的 Actions 分钟数不限。
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape public provider pages
        run: python scraper.py

      - name: Build static site
        run: python build.py

      - name: Commit refreshed data and site
        run: |
          git config user.name "vps-deals-radar"
          git config user.email "vps-deals-radar@users.noreply.github.com"
          git add data/offers.json site
          if git diff --staged --quiet; then
            echo "no data change this run"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx --yes wrangler@4 pages deploy site --project-name=vps-deals-promo-radar --branch=main --commit-dirty=true
