<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <title>{{title}}</title>
  {{head}}
  <style>
    :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --line:#232b36; --text:#e6edf3; --muted:#8b949e; --accent:#f6821f; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    .wrap { max-width:1000px; margin:0 auto; padding:0 20px 64px; }
    header.site { border-bottom:1px solid var(--line); background:var(--panel); }
    header.site .wrap { padding:16px 20px; }
    .brand { font-weight:700; font-size:20px; letter-spacing:.2px; }
    nav.crumbs { margin-top:6px; font-size:14px; color:var(--muted); }
    h1 { font-size:30px; line-height:1.25; margin:32px 0 8px; }
    h2 { font-size:20px; margin:36px 0 12px; }
    p.lede { color:var(--muted); margin:0 0 8px; }
    .stats { display:flex; gap:24px; flex-wrap:wrap; margin:20px 0 4px; }
    .stats div { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 16px; min-width:140px; }
    .stats b { display:block; font-size:22px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; margin-top:14px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; }
    .card h3 { margin:0 0 8px; font-size:17px; }
    .price { font-weight:700; white-space:nowrap; }
    .price.big { font-size:22px; margin:0; }
    .muted { color:var(--muted); font-size:14px; }
    table { width:100%; border-collapse:collapse; margin-top:12px; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
    th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); font-size:15px; }
    th { color:var(--muted); font-weight:600; font-size:13px; text-transform:uppercase; letter-spacing:.04em; }
    tr:last-child td { border-bottom:none; }
    .btn { display:inline-block; background:var(--accent); color:#111; font-weight:600; padding:6px 12px; border-radius:6px; font-size:14px; }
    .btn:hover { text-decoration:none; opacity:.9; }
    footer.site { border-top:1px solid var(--line); margin-top:48px; padding-top:20px; }
    @media (max-width:640px){ table, thead, tbody, th, td, tr { display:block; } thead { display:none; } td { border:none; padding:4px 0; } tr { border-bottom:1px solid var(--line); padding:10px 0; display:block; } }
  </style>
</head>
<body>
  <header class="site"><div class="wrap">
    <div class="brand">{{brand}}</div>
    <nav class="crumbs">{{nav}}</nav>
  </div></header>
  <main class="wrap">
    <h1>{{brand}} — VPS deals tracked from provider pages</h1>
    <p class="lede">{{tagline}}</p>
    <div class="stats">
      <div><b>{{offer_count}}</b><span class="muted">plans tracked</span></div>
      <div><b>{{provider_count}}</b><span class="muted">providers</span></div>
      <div><b>{{generated_at}}</b><span class="muted">last data pull (UTC)</span></div>
    </div>
    <h2>Providers</h2>
    <div class="grid">{{cards}}</div>
    <h2>Latest tracked plans</h2>
    <table>
      <thead><tr><th>Provider</th><th>Plan</th><th>Price as published</th><th></th></tr></thead>
      <tbody>{{rows}}</tbody>
    </table>
    <footer class="site">{{footer}}</footer>
  </main>
</body>
</html>
